<main class="game" id="game"><header><div class="left"><button class="iconbutton" id="menu" aria-label="Open game menu">☰</button><h1>Matter Lab</h1></div><div class="score" aria-label="Stars earned"><span aria-hidden="true">★</span><span id="stars">0 / 9</span></div></header>
<div class="goalwrap"><section class="goal" id="goal" aria-label="Your goal"><div class="levelnumber" id="levelnumber">1</div><div class="goaltext"><h2 id="goalTitle">Melt the ice.</h2><p id="instruction" aria-live="polite">Tap the ice, then a beaker.</p><div class="progress" id="goalProgress" role="progressbar" aria-label="Goal progress" aria-valuemin="0" aria-valuemax="100"><span></span></div></div><div class="goalbuttons"><button class="hintbutton" id="hint">Hint</button><button class="next hidden" id="next">Next →</button></div></section></div>

<footer class="bottom"><span class="counter" id="counter">Same matter. A new state.</span><div class="bottomtools"><button class="textbutton" id="reset">Start over</button><button class="pausebutton" id="pause" aria-pressed="false">Ⅱ Pause</button></div></footer></main>
<p class="extras">Drag a material into a beaker, or tap to place it. Science &amp; teacher notes are in the menu.</p>
<dialog id="dialog" aria-labelledby="dialogLabel"><div class="dialoghead"><span id="dialogLabel">Matter Lab</span><button id="closeDialog" aria-label="Close dialog">×</button></div><div id="dialogBody"></div></dialog><div id="toast" class="toast hidden" role="status"></div><div id="dragghost" class="dragghost hidden" aria-hidden="true"></div>
<script>
const $=id=>document.getElementById(id),letters=['A','B','C'];
const materials={ice:{name:'Water ice',sub:'H₂O · −15 °C',e:5,type:'water'},water:{name:'Liquid water',sub:'H₂O · 20 °C',e:80,type:'water'},dryice:{name:'Dry ice',sub:'Solid CO₂',e:0,type:'co2'},vapor:{name:'Humid air',sub:'Water vapor supply',e:0,type:'vapor'}};
const missions=[
{title:'Break the ice',desc:'Melt a sample of water ice completely. Choose a material and an energy source.',hint:'Drag Water ice into an empty beaker, then select Burner. Keep heating through the 0 °C plateau.',q:'What should happen when enough energy enters ice?',answers:['It melts into liquid water.','It becomes a different substance.','Its particles disappear.'],correct:0,why:'The water molecules remain water. Energy changes their arrangement and movement.',goal:'melt'},
{title:'Reverse the change',desc:'Freeze a liquid-water sample. Reverse the direction of energy transfer.',hint:'Add Liquid water, select Freezer, and wait through 0 °C until the sample is solid.',q:'To freeze liquid water, energy must…',answers:['enter the water.','leave the water.','turn into water.'],correct:1,why:'Freezing releases energy from the water to its colder surroundings.',goal:'freeze'},
{title:'The disappearing puddle',desc:'Evaporate at least 3 g of water while it stays below 100 °C.',hint:'Add Liquid water and keep Room selected, or gently heat it. Watch the gas-released counter. Try 4× speed.',q:'Can water become vapor below its boiling point?',answers:['No, it must reach 100 °C.','Yes, at the liquid surface.','Only if it freezes first.'],correct:1,why:'Surface evaporation can happen at room temperature. Warmer water generally evaporates faster.',goal:'evaporate'},
{title:'Bubbles from within',desc:'Boil water and release at least 8 g of vapor by boiling.',hint:'Add Liquid water and select Burner. Watch for bubbles at 100 °C. Heat continues to change liquid into gas.',q:'How does boiling differ from surface evaporation?',answers:['Boiling makes vapor bubbles throughout the liquid.','Boiling changes water into air.','Boiling only happens at the surface.'],correct:0,why:'During boiling, vapor forms inside the liquid as well as at the surface.',goal:'boil'},
{title:'Catch invisible water',desc:'Collect 12 g of liquid droplets from humid air on a cool plate.',hint:'Add Humid air to an empty station. Change Collector from Open to Cool plate · 5 °C.',q:'Water droplets forming from vapor are an example of…',answers:['melting.','sublimation.','condensation.'],correct:2,why:'Water vapor loses energy at a sufficiently cool surface and becomes liquid.',goal:'condense'},
{title:'Skip the liquid',desc:'Let at least 15 g of dry ice change directly from solid CO₂ into gas.',hint:'Add Dry ice and leave Room selected. Even room-temperature surroundings are warm enough for sublimation.',q:'At ordinary air pressure, dry ice warms into…',answers:['liquid water.','carbon dioxide gas, with no liquid stage.','liquid carbon dioxide first.'],correct:1,why:'Dry ice is solid CO₂. At about 1 atm, it sublimates near −78.5 °C.',goal:'sublime'},
{title:'Build a frost crystal',desc:'Deposit 12 g of frost directly from water vapor onto a subzero plate.',hint:'Add Humid air and select Frost plate · −20 °C. Watch crystals grow directly on the plate.',q:'Vapor becoming solid frost without a liquid stage is…',answers:['freezing.','evaporation.','deposition.'],correct:2,why:'Deposition goes directly from gas to solid. Freezing starts with a liquid.',goal:'deposit'},
{title:'Close the loop',desc:'In the same beaker, melt ice and then freeze that water again.',hint:'Start with Water ice, heat until fully melted, then switch that same station to Freezer.',q:'After ice melts and freezes again, what is the substance?',answers:['Still water.','A new chemical.','Half water and half air.'],correct:0,why:'Changes of state are physical changes: the substance keeps its chemical identity.',goal:'cycle'},
{title:'Three-station finale',desc:'Use all three stations: melt ice in A, freeze water in B, and sublimate dry ice in C.',hint:'Load A with Water ice + Burner; B with Liquid water + Freezer; C with Dry ice + Room. Run them together.',q:'Which statement links all three experiments?',answers:['Each makes a new substance.','Energy transfer changes the physical state.','All three must reach 100 °C.'],correct:1,why:'Energy transfer changes state; each sample retains its chemical identity.',goal:'finale'}
];
const fresh=()=>({kind:null,type:null,e:0,mass:0,out:0,mode:'room',power:2,lid:'open',solidCollected:0,liquidCollected:0,evap:0,boiled:0,condensed:0,deposited:0,events:new Set(),melted:false,cycled:false,age:0});
let stations=[fresh(),fresh(),fresh()],selected=null,activeStation=0,mode='campaign',missionIndex=0,phase='ready',paused=false,dialogWasPaused=false,simTime=0,last=0,uiTick=0,notes=[],toastTimer,drag=null,suppressClick=false;
let earned=[];try{const value=JSON.parse(localStorage.getItem('matter-lab-v3')||'[]');if(Array.isArray(value))earned=[...new Set(value.filter(x=>Number.isInteger(x)&&x>=0&&x<missions.length))]}catch{}
function save(){try{localStorage.setItem('matter-lab-v3',JSON.stringify(earned))}catch{}}
function waterState(e){if(e<=20)return{temp:e-20,solid:1,liquid:0,state:'Solid ice'};if(e<60)return{temp:0,solid:1-(e-20)/40,liquid:(e-20)/40,state:'Ice + water'};return{temp:Math.min(100,e-60),solid:0,liquid:1,state:'Liquid water'}}
function missionMet(){const g=missions[missionIndex].goal;return g==='melt'?stations.some(s=>s.events.has('melt')):g==='freeze'?stations.some(s=>s.events.has('freeze')):g==='evaporate'?stations.some(s=>s.evap>=3):g==='boil'?stations.some(s=>s.boiled>=8):g==='condense'?stations.some(s=>s.condensed>=12):g==='sublime'?stations.some(s=>s.type==='co2'&&s.out>=15):g==='deposit'?stations.some(s=>s.deposited>=12):g==='cycle'?stations.some(s=>s.kind==='ice'&&s.cycled):stations[0].events.has('melt')&&stations[1].events.has('freeze')&&stations[2].type==='co2'&&stations[2].out>=15}
function tick(dt){if(paused)return;simTime+=dt;stations.forEach((s,i)=>{if(!s.kind)return;s.age+=dt;if(s.type==='water'&&s.mass>.001){const prev=s.e;const force=s.mode==='hot'?9*s.power:s.mode==='cold'?-9*s.power:Math.sign(80-s.e)*Math.min(1,Math.abs(80-s.e));s.e=Math.max(0,Math.min(160,s.e+force*dt));if(prev<60&&s.e>=60){s.melted=true;once(s,i,'melt','Melting complete','Solid water became liquid; the substance is still H₂O.')}if(prev>20&&s.e<=20){once(s,i,'freeze','Freezing complete','Liquid water became solid as energy left the sample.');if(s.melted)s.cycled=true}const p=waterState(s.e);if(p.liquid>0){if(s.e>=160&&s.mode==='hot'){const amount=Math.min(s.mass,dt*7*s.power);s.mass-=amount;s.out+=amount;s.boiled+=amount;once(s,i,'boil','Boiling observed','Vapor bubbles form throughout the liquid at about 100 °C.')}else if(p.temp>0){const amount=Math.min(s.mass,dt*(.04+p.temp*p.temp*.00035)*p.liquid);s.mass-=amount;s.out+=amount;s.evap+=amount;if(s.evap>=1)once(s,i,'evaporate','Evaporation observed','Water entered the air from the liquid surface below boiling.')}}}else if(s.type==='co2'&&s.mass>.001){const rate=s.mode==='hot'?4*s.power:s.mode==='cold'?.6:2.5;const amount=Math.min(s.mass,dt*rate);s.mass-=amount;s.out+=amount;if(s.out>=1)once(s,i,'sublime','Sublimation observed','Solid CO₂ changed directly into gas. No liquid formed.')}else if(s.type==='vapor'){if(s.lid==='cool'){const amount=Math.min(100-s.liquidCollected,dt*4);s.liquidCollected+=amount;s.condensed+=amount;if(s.condensed>=1)once(s,i,'condense','Condensation observed','Water vapor formed liquid droplets on the cool plate.')}if(s.lid==='frost'){const amount=Math.min(100-s.solidCollected,dt*4);s.solidCollected+=amount;s.deposited+=amount;if(s.deposited>=1)once(s,i,'deposit','Deposition observed','Water vapor formed ice directly on the subzero plate.')}}});if(mode==='campaign'&&phase==='running'&&missionMet()){win()}}
function science(){openDialog('SCIENCE & SOURCES',`<h2>The science behind the game</h2><p>This model uses pure water and carbon dioxide at about <b>1 atmosphere</b>. Temperature, amounts, and change rates are simplified for classroom play.</p><ul><li>Water melts and freezes near <b>0 °C</b> and boils near <b>100 °C</b>. During bulk melting/freezing and boiling, energy changes state while temperature remains steady.</li><li><b>Evaporation</b> happens at the surface below boiling. <b>Boiling</b> makes vapor bubbles within the liquid.</li><li>Humid air supplies water vapor. A sufficiently cool surface can collect liquid; a subzero surface can collect frost directly. The plates represent suitable humidity and surface conditions, not a universal dew point.</li><li>Dry ice is <b>solid CO₂</b>; it sublimates near <b>−78.5 °C</b> at 1 atm. A normal freezer cannot freeze CO₂ gas into dry ice.</li><li>Water vapor and CO₂ gas are invisible. Purple trails symbolize gas movement. Real white steam or dry-ice fog consists of tiny condensed droplets.</li></ul><h3>Reliable reading</h3><ul><li><a target="_blank" rel="noopener" href="https://www.acs.org/middleschoolchemistry/lessonplans/chapter2/lesson2.html">American Chemical Society · Evaporation</a></li><li><a target="_blank" rel="noopener" href="https://www.acs.org/middleschoolchemistry/lessonplans/chapter2/lesson3.html">American Chemical Society · Condensation</a></li><li><a target="_blank" rel="noopener" href="https://www.acs.org/middleschoolchemistry/lessonplans/chapter2/lesson5.html">American Chemical Society · Melting and dry ice</a></li><li><a target="_blank" rel="noopener" href="https://www.usgs.gov/water-science-school/science/sublimation-and-water-cycle">USGS · Sublimation, dry ice, and deposition</a></li><li><a target="_blank" rel="noopener" href="https://openstax.org/books/college-physics-2e/pages/14-3-phase-change-and-latent-heat">OpenStax · Phase change and latent heat</a></li><li><a target="_blank" rel="noopener" href="https://openstax.org/books/college-physics-2e/pages/13-6-humidity-evaporation-and-boiling">OpenStax · Evaporation versus boiling</a></li></ul><h3>Model limits</h3><p>Time is accelerated; energy and evaporation rates are illustrative, not measured predictions. The burner transfers energy to the sample; its combustion is not modeled. The freezer approaches −20 °C. Samples start at 100 g; the gas counter tracks matter entering the surroundings. Humid air is an external water source; each plate collects up to 100 g. Switching plates removes the old collector and its deposit. Condensation is drawn as droplets falling into the beaker. The game does not model pressure changes, mixtures, evaporation cooling, water-ice sublimation, or every competing surface process.</p>`)}

function tone(win=false){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const now=audioCtx.currentTime;[0,...(win?[.12,.24]:[])].forEach((at,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=win?[523,659,784][i]:460;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(0,now+at);g.gain.linearRampToValueAtTime(.09,now+at+.015);g.gain.exponentialRampToValueAtTime(.001,now+at+.19);o.start(now+at);o.stop(now+at+.2)})}catch{}}

function useTool(i,tool){const s=stations[i];selectStation(i);if(!s.kind){toast('Put something in this beaker first.');return}if(s.type==='vapor'){const lid=tool==='hot'?'cool':tool==='cold'?'frost':'open';const next=s.lid===lid?'open':lid;if(next!==s.lid&&(s.liquidCollected>0||s.solidCollected>0)){notify(i,'New plate','The old plate and its deposit were removed.');s.liquidCollected=0;s.solidCollected=0} s.lid=next;}else{s.mode=s.mode===tool?'room':tool;}tone();renderUI()}
function stateLabel(s){if(!s.kind)return'Empty';if(s.type==='co2')return s.mass>.01?'Dry ice → CO₂ gas':'CO₂ gas in the air';if(s.type==='vapor')return s.lid==='cool'?'Vapor → liquid droplets':s.lid==='frost'?'Vapor → solid frost':'Invisible water vapor';if(s.mass<.01)return'Water vapor in the air';const p=waterState(s.e);if(p.solid===1)return'Ice · solid';if(p.solid>0)return s.mode==='cold'?'Freezing · liquid → solid':'Melting · solid → liquid';if(s.e>=160&&s.mode==='hot')return'Boiling · liquid → gas';return s.mode==='cold'?'Water · cooling':'Water · liquid'}
function shortState(s){if(!s.kind)return'empty';if(s.type==='vapor')return s.lid==='cool'?'droplets':s.lid==='frost'?'frost':'vapor';if(s.type==='co2')return s.mass>.01?'dry ice':'gas';if(s.mass<.01)return'gas';const p=waterState(s.e);return p.solid===1?'ice':p.solid>0?'ice + water':'water'}
function missionProgress(){const g=missions[missionIndex].goal,max=key=>Math.max(0,...stations.map(s=>s[key]||0));if(g==='melt')return Math.max(0,...stations.filter(s=>s.kind==='ice').map(s=>Math.min(1,s.e/60)));if(g==='freeze')return Math.max(0,...stations.filter(s=>s.kind==='water').map(s=>Math.min(1,Math.max(0,(80-s.e)/60))));if(g==='evaporate')return max('evap')/3;if(g==='boil')return max('boiled')/8;if(g==='condense')return max('condensed')/12;if(g==='deposit')return max('deposited')/12;if(g==='sublime')return Math.max(0,...stations.filter(s=>s.type==='co2').map(s=>s.out))/15;if(g==='cycle')return Math.max(0,...stations.filter(s=>s.kind==='ice').map(s=>s.cycled?1:s.melted?.5+.5*Math.min(1,Math.max(0,(60-s.e)/40)):.5*s.e/60));return(stations[0].events.has('melt')?1/3:0)+(stations[1].events.has('freeze')?1/3:0)+(stations[2].type==='co2'?Math.min(1,stations[2].out/15)/3:0)}
function guidance(){if(mode==='sandbox')return'Try a material. See what heat or cold can do.';if(phase==='complete')return insights[missionIndex];const g=missions[missionIndex].goal,key=['melt','cycle'].includes(g)?'ice':['freeze','evaporate','boil'].includes(g)?'water':g==='sublime'?'dryice':'vapor';if(g==='finale')return'1: melt ice · 2: freeze water · 3: dry ice.';const samples=stations.filter(s=>s.kind===key);if(!samples.length)return'Tap '+names[key].toLowerCase()+', then a beaker.';if(g==='sublime')return'Just wait. The room is warm enough!';if(g==='condense')return samples.some(s=>s.lid==='cool')?'Watch vapor collect as tiny droplets.':'Tap Droplets to add a cool plate.';if(g==='deposit')return samples.some(s=>s.lid==='frost')?'Watch frost grow straight from vapor.':'Tap Frost to add a freezing-cold plate.';if(g==='evaporate')return'Wait, or tap Heat to speed things up.';if(g==='freeze'||(g==='cycle'&&samples.some(s=>s.melted)))return samples.some(s=>s.mode==='cold')?'Keep cooling. Watch the ice form.':'Tap Cool'+(g==='cycle'?' on the same beaker.':'.');return samples.some(s=>s.mode==='hot')?g==='boil'?'Keep heating. Look for bubbles.':'Keep heating. Watch the ice melt.':'Tap Heat.'}

function renderGoal(){const text=guidance();if($('instruction').textContent!==text)$('instruction').textContent=text;const p=mode==='sandbox'?0:phase==='complete'?1:Math.max(0,Math.min(1,missionProgress()));$('goalProgress').classList.toggle('hidden',mode==='sandbox');$('goalProgress').firstElementChild.style.width=p*100+'%';$('goalProgress').setAttribute('aria-valuenow',Math.round(p*100));const key=mode==='sandbox'||phase==='complete'?null:['ice','water','water','water','vapor','dryice','vapor','ice',null][missionIndex];document.querySelectorAll('[data-material]').forEach(b=>b.classList.toggle('suggested',b.dataset.material===key&&!stations.some(s=>s.kind===key)))}

function startDrag(e,key,node){if(e.button!==0)return;drag={key,x:e.clientX,y:e.clientY,active:false};node.setPointerCapture(e.pointerId);function cleanup(){node.removeEventListener('pointermove',move);node.removeEventListener('pointerup',finish);node.removeEventListener('pointercancel',cancel);$('dragghost').classList.add('hidden');document.querySelectorAll('.dropover').forEach(el=>el.classList.remove('dropover'))}function move(ev){if(!drag)return;if(Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y)>9)drag.active=true;if(!drag.active)return;const g=$('dragghost');g.textContent=names[key];g.classList.remove('hidden');g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';document.querySelectorAll('.dropover').forEach(el=>el.classList.remove('dropover'));document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-station]')?.classList.add('dropover')}function finish(ev){const d=drag;drag=null;cleanup();if(d?.active){suppressClick=true;setTimeout(()=>suppressClick=false,100);const hit=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-station]');if(hit)loadMaterial(Number(hit.dataset.station),key);else{selected=key;updateSelection()}}}function cancel(){drag=null;cleanup()}node.addEventListener('pointermove',move);node.addEventListener('pointerup',finish);node.addEventListener('pointercancel',cancel)}

function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function line(ctx,points,fill){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.stroke()}
function cube(ctx,x,y,size,dry=false,angle=0){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.strokeStyle='#294e62';ctx.lineWidth=2.2;ctx.lineJoin='round';line(ctx,[[-size*.5,-size*.32],[size*.14,-size*.52],[size*.5,-size*.28],[-size*.16,-size*.06]],dry?'#fafafa':'#d4f6ff');line(ctx,[[-size*.5,-size*.32],[-size*.16,-size*.06],[-size*.16,size*.55],[-size*.5,size*.3]],dry?'#c2cad5':'#81cdeb');line(ctx,[[-size*.16,-size*.06],[size*.5,-size*.28],[size*.5,size*.32],[-size*.16,size*.55]],dry?'#e4e8ef':'#abe7f8');ctx.beginPath();ctx.moveTo(size*.01,size*.06);ctx.lineTo(size*.3,-size*.04);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.restore()}
function droplet(ctx,x,y,r){ctx.beginPath();ctx.moveTo(x,y-r);ctx.bezierCurveTo(x-r*1.7,y+r*.6,x-r*.8,y+r*1.4,x,y+r*1.4);ctx.bezierCurveTo(x+r*.8,y+r*1.4,x+r*1.7,y+r*.6,x,y-r);ctx.fillStyle='#52bce5';ctx.fill();ctx.strokeStyle='#294e62';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.moveTo(x-r*.4,y+r*.3);ctx.lineTo(x-r*.25,y+r*.7);ctx.strokeStyle='#d3f7ff';ctx.lineWidth=3;ctx.stroke()}
function flame(ctx,x,y,size,t=0){ctx.save();ctx.translate(x,y);ctx.strokeStyle='#783d2a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-size*.48,0);ctx.bezierCurveTo(-size*.8,-size*.6,-size*.04,-size*.6,-size*.12+Math.sin(t)*2,-size*1.45);ctx.bezierCurveTo(size*.8,-size*.75,size*.62,-size*.12,size*.48,0);ctx.quadraticCurveTo(0,size*.3,-size*.48,0);ctx.fillStyle='#ff854c';ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-size*.22,0);ctx.quadraticCurveTo(-size*.25,-size*.35,size*.08,-size*.62);ctx.quadraticCurveTo(size*.38,0,-size*.22,0);ctx.fillStyle='#ffe37b';ctx.fill();ctx.restore()}
function snow(ctx,x,y,r){ctx.save();ctx.strokeStyle='#337591';ctx.lineWidth=2.4;ctx.lineCap='round';for(let k=0;k<6;k++){const a=k*Math.PI/3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);for(const d of [-1,1]){ctx.moveTo(x+Math.cos(a)*r*.55,y+Math.sin(a)*r*.55);ctx.lineTo(x+Math.cos(a)*r*.55+Math.cos(a+d*.8)*r*.35,y+Math.sin(a)*r*.55+Math.sin(a+d*.8)*r*.35)}ctx.stroke()}ctx.restore()}
function drawIcon(c,type){const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.save();ctx.scale(c.width/100,c.height/100);if(type==='ice'||type==='dryice'){cube(ctx,33,58,42,type==='dryice',-.17);cube(ctx,66,41,40,type==='dryice',.15)}else if(type==='water'||type==='droplets'){droplet(ctx,51,46,24)}else if(type==='fire'){flame(ctx,50,76,38)}else if(type==='snow'){snow(ctx,50,50,33)}else{ctx.strokeStyle='#6b6182';ctx.lineWidth=4;ctx.lineCap='round';for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(28+i*23,80);ctx.bezierCurveTo(6+i*23,55,49+i*23,42,28+i*23,17);ctx.stroke()}}ctx.restore()}
function drawScene(canvas,s,clock){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;const dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const scale=Math.min(h/282,w/280);ctx.translate(w/2,h/2);ctx.scale(scale,scale);ctx.translate(-140,-141);const cx=140,left=70,right=210,top=60,base=216;ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=3;ctx.strokeStyle='#294653';
// Readable, outlined apparatus: glass, sample, and the active energy source.
ctx.beginPath();ctx.ellipse(cx,270,91,7,0,0,Math.PI*2);ctx.fillStyle='#79acba55';ctx.fill();
if(s.mode==='cold'&&s.kind&&s.type!=='vapor'){round(ctx,58,54,164,178,17);ctx.fillStyle='#87cfea33';ctx.fill();ctx.strokeStyle='#6babc3';ctx.setLineDash([6,7]);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#294653'}
ctx.beginPath();ctx.moveTo(left-9,top);ctx.lineTo(left+2,top+11);ctx.lineTo(left+2,base-11);ctx.quadraticCurveTo(left+2,base,left+14,base);ctx.lineTo(right-13,base);ctx.quadraticCurveTo(right,base,right,base-12);ctx.lineTo(right,top+2);ctx.fillStyle='#f5feff77';ctx.fill();
const p=s.type==='water'?waterState(s.e):null,liquid=s.type==='water'?(p.liquid||0)*s.mass/100:s.type==='vapor'?s.liquidCollected/100:0;
if(liquid>0){const surface=base-10-liquid*90;ctx.save();round(ctx,left+5,top+5,right-left-9,base-top-9,10);ctx.clip();ctx.beginPath();ctx.moveTo(left,surface);for(let x=left;x<=right+4;x+=3)ctx.lineTo(x,surface+Math.sin(x*.055+clock*2)*2);ctx.lineTo(right,base);ctx.lineTo(left,base);ctx.closePath();ctx.fillStyle='#70cbed';ctx.fill();ctx.beginPath();ctx.moveTo(left,surface);for(let x=left;x<=right;x+=3)ctx.lineTo(x,surface+Math.sin(x*.055+clock*2)*2);ctx.strokeStyle='#29799e';ctx.lineWidth=2;ctx.stroke();if(s.type==='water'&&s.e>=160&&s.mode==='hot'){for(let i=0;i<10;i++){const a=(clock*.62+i*.109)%1;ctx.beginPath();ctx.arc(left+14+(i*37)%111,base-8-a*(base-surface-10),2+a*3,0,Math.PI*2);ctx.strokeStyle='#e5faff';ctx.lineWidth=2;ctx.stroke()}}ctx.restore()}
const solid=s.type==='water'?(p.solid||0)*s.mass/100:s.type==='co2'?s.mass/100:0;if(solid>0){for(let i=0;i<4;i++){const size=(i<2?45:40)*Math.sqrt(solid);cube(ctx,cx+(i%2?23:-23)*Math.sqrt(solid),base-25-(i>1?35:0)*Math.sqrt(solid),size,s.type==='co2',(i%2?1:-1)*.12)}}
const releasing=s.type==='co2'&&s.mass>0||s.type==='water'&&s.mass>0&&p.liquid>0&&p.temp>0||s.type==='vapor';
if(releasing){ctx.lineWidth=2.5;ctx.strokeStyle='#807296';for(let i=0;i<3;i++){const r=(clock*.35+i*.3)%1;ctx.globalAlpha=.75*(1-r);ctx.beginPath();const x=116+i*24,y=83-r*62;ctx.moveTo(x,y);ctx.bezierCurveTo(x-9,y-12,x+11,y-21,x+3,y-32);ctx.stroke()}ctx.globalAlpha=1;ctx.font='12px Trebuchet MS';ctx.fillStyle='#695579';ctx.textAlign='center';ctx.fillText('gas (shown as lines)',cx,16)}
ctx.strokeStyle='#294653';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(left-9,top);ctx.lineTo(left+2,top+11);ctx.lineTo(left+2,base-11);ctx.quadraticCurveTo(left+2,base,left+14,base);ctx.lineTo(right-13,base);ctx.quadraticCurveTo(right,base,right,base-12);ctx.lineTo(right,top+2);ctx.stroke();ctx.beginPath();ctx.moveTo(left-9,top);ctx.quadraticCurveTo(cx,top+7,right+3,top);ctx.stroke();ctx.beginPath();ctx.moveTo(left+11,top+20);ctx.lineTo(left+11,base-19);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#759fac';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(right-18,top+30+i*28);ctx.lineTo(right-5,top+30+i*28);ctx.stroke()}
if(s.type==='vapor'&&s.lid!=='open'){round(ctx,left-10,top-5,160,9,4);ctx.fillStyle=s.lid==='cool'?'#97cdd7':'#d4f2ff';ctx.strokeStyle='#294653';ctx.fill();ctx.stroke();if(s.lid==='cool'&&s.liquidCollected>0&&s.liquidCollected<100){for(let i=0;i<5;i++){const r=(clock*.4+i*.19)%1;droplet(ctx,left+18+i*26,top+12+r*(base-top-30),2.5)}}else if(s.lid==='frost'&&s.solidCollected>0){for(let i=0;i<7;i++)snow(ctx,left+6+i*21,top-6-Math.sin(i*2)*4,2+Math.min(12,Math.sqrt(s.solidCollected)*1.4))}ctx.font='11px Trebuchet MS';ctx.fillStyle='#294653';ctx.textAlign='center';ctx.fillText('collector plate',cx,238)}else{round(ctx,90,255,100,11,5);ctx.fillStyle=s.mode==='cold'?'#82c5e9':'#a2adb1';ctx.strokeStyle='#294653';ctx.lineWidth=2.5;ctx.fill();ctx.stroke();if(s.mode==='hot'&&s.kind&&s.mass>0){for(let i=0;i<3;i++)flame(ctx,120+i*20,251,14+Math.sin(clock*7+i)*1.5,clock*8+i)}else if(s.mode==='cold'&&s.kind){for(let i=0;i<3;i++)snow(ctx,113+i*27,241+Math.sin(clock*2+i)*2,8)}else{round(ctx,118,244,44,10,3);ctx.fillStyle='#c3cccf';ctx.fill();ctx.stroke()}}
}
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;tick(dt*playSpeed);uiTick+=dt;if(uiTick>.12){uiTick=0;renderUI()}const clock=matchMedia('(prefers-reduced-motion: reduce)').matches?0:simTime;stations.forEach((s,i)=>drawScene($('station'+i).querySelector('.beaker canvas'),s,clock));requestAnimationFrame(frame)}
$('dialog').addEventListener('close',()=>{const next=dialogNext;dialogNext=null;setPause(dialogWasPaused);if(next)next()});$('closeDialog').onclick=closeDialog;$('menu').onclick=menu;$('hint').onclick=()=>toast(missions[missionIndex].hint);$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'Sound on':'Sound off';$('sound').setAttribute('aria-pressed',soundOn);tone()};$('pause').onclick=()=>{if(phase==='complete'&&mode==='campaign'){toast('Goal complete! Tap Next, or open Free play from the menu.');return}setPause(!paused)};$('reset').onclick=()=>mode==='sandbox'?freeLab():startLevel(missionIndex);$('next').onclick=()=>{if(missionIndex<8){startLevel(missionIndex+1);tone()}else{openDialog('Nice experimenting!',`<h2>${earned.length===9?'Nine stars. Nine discoveries.':'You reached the final level!'}</h2><p>You have ${earned.length} of 9 stars. Pick a level to replay, or keep experimenting in Free play.</p><div class="menugrid"><button class="primary" id="finishFree">Free play</button><button id="finishLevels">Pick a level</button></div>`);$('finishFree').onclick=()=>{closeDialog(freeLab)};$('finishLevels').onclick=()=>{closeDialog(levels)}}};document.addEventListener('visibilitychange',()=>{if(document.hidden){setPause(true);if($('dialog').open)dialogWasPaused=true}});build();startLevel(0);requestAnimationFrame(frame);

</script>
